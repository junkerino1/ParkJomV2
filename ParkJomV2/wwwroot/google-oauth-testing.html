<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ParkJom Google OAuth Test</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            display:flex;
            flex-direction:column;
            align-items:center;
            margin-top:60px;
            background:#f5f5f5;
        }

        h2{
            color:#333;
        }

        #token{
            width:90%;
            height:200px;
            margin-top:20px;
            padding:10px;
            font-size:12px;
        }

        button{
            margin-top:20px;
            padding:12px 24px;
            cursor:pointer;
            font-size:16px;
        }

        pre{
            width:90%;
            background:white;
            padding:15px;
            border-radius:8px;
            overflow:auto;
        }
    </style>
</head>
<body>

<h2>ParkJom Google OAuth Test</h2>
<div id="g_id_onload"
     data-client_id="917128720686-vrm50eevjakijmkftq8dj4qj7itl8d5m.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-size="large"
     data-theme="filled_blue">
</div>

<h3>Google ID Token</h3>

<textarea id="token" readonly></textarea>

<button onclick="callAPI()">
    Call ASP.NET API
</button>

<button onclick="window.location.href='http://127.0.0.1:5500/pdf-private-view.html'">Go to PDF Viewer</button>

<h3>API Response</h3>

<pre id="response"></pre>

<script>

let googleToken = "";

function handleCredentialResponse(response){

    googleToken = response.credential;

    document.getElementById("token").value = googleToken;

    console.log(googleToken);
}

async function callAPI(){

    if(googleToken === ""){
        alert("Please sign in first.");
        return;
    }

    const result = await fetch("https://localhost:7250/api/user/register",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            googleToken:googleToken
        })

    });

    const data = await result.json();

    document.getElementById("response").textContent =
        JSON.stringify(data,null,4);

}

</script>

</body>
</html>
